<svg xmlns="http://www.w3.org/2000/svg" width="420" viewBox="14 2 68 125">
  <title>交泰如意 · 泰卦佩 正视图（105 x 48 x 6mm，模数 m=3mm）</title>
  <desc>如意谱系泰卦挂坠：上坤下乾，天地交泰。三瓣云头如意首（中瓣为玉璧式穿绳孔）、联珠颈、回纹交泰带、太极尾盘。</desc>

  <!-- 画布底色 -->
  <rect x="14" y="2" width="68" height="125" fill="#DDD2B4"/>

  <!-- ══ L0 鎏金基底 z:0-4.5mm（全轮廓 = 受力骨架）══ -->
  <g fill="#8A6A2F">
    <!-- 如意首·中瓣（璧） -->
    <circle cx="48" cy="26" r="14"/>
    <!-- 如意首·左右云头瓣（三瓣云头） -->
    <circle cx="33" cy="30" r="9"/>
    <circle cx="63" cy="30" r="9"/>
    <!-- 颈束 + 柄身 + 尾圆盘外廓（下半圆 r18） -->
    <path d="M30,39 H66 V99 A18 18 0 0 1 30,99 Z"/>
  </g>

  <!-- ══ L1 墨色场 z:4.5-6.0mm ══ -->
  <g fill="#2A2419">
    <!-- 首部三瓣内场 -->
    <circle cx="48" cy="26" r="11"/>
    <circle cx="33" cy="30" r="6"/>
    <circle cx="63" cy="30" r="6"/>
    <!-- 柄部爻场（24x48）+ 尾盘内场（r15） -->
    <rect x="36" y="48" width="24" height="48"/>
    <circle cx="48" cy="99" r="15"/>
  </g>

  <!-- 太极·宣纸盘面 -->
  <circle cx="48" cy="102.5" r="8" fill="#E9DDBC"/>

  <!-- 太极·墨鱼（左半身 + 下鱼头，S 形阴阳界） -->
  <g fill="#2A2419">
    <path d="M48 94.5 A8 8 0 0 0 48 110.5 Z"/>
    <circle cx="48" cy="106.5" r="4"/>
  </g>
  <!-- 太极·纸鱼头 -->
  <circle cx="48" cy="98.5" r="4" fill="#E9DDBC"/>

  <!-- ══ L1 鎏金浮雕件（凸于墨场）══ -->
  <g fill="#8A6A2F">
    <!-- 玉璧式受力环：外Ø12，内Ø6（穿绳孔） -->
    <circle cx="48" cy="24" r="6"/>
    <!-- 谷纹凸点阵（左右云头瓣内，各三粒，Ø3） -->
    <circle cx="33" cy="28" r="1.5"/><circle cx="30.5" cy="32" r="1.5"/><circle cx="35.5" cy="32" r="1.5"/>
    <circle cx="63" cy="28" r="1.5"/><circle cx="60.5" cy="32" r="1.5"/><circle cx="65.5" cy="32" r="1.5"/>
  </g>
  <!-- 交泰回纹带（单回纹 x2，单元8x6，线宽2） -->
  <path d="M38 74 L38 70 L44 70 L44 74 L41 74 M52 74 L52 70 L58 70 L58 74 L55 74"
        fill="none" stroke="#8A6A2F" stroke-width="2" stroke-linecap="butt"/>

  <!-- ══ L1 朱砂件（爻线主角 + 点睛）══ -->
  <g fill="#9E2B20">
    <!-- 上卦·坤 三阴爻（上六/六五/六四，两段式） -->
    <rect x="37.5" y="51" width="9" height="3"/><rect x="49.5" y="51" width="9" height="3"/>
    <rect x="37.5" y="57" width="9" height="3"/><rect x="49.5" y="57" width="9" height="3"/>
    <rect x="37.5" y="63" width="9" height="3"/><rect x="49.5" y="63" width="9" height="3"/>
    <!-- 下卦·乾 三阳爻（九三/九二/初九，整条） -->
    <rect x="37.5" y="78" width="21" height="3"/>
    <rect x="37.5" y="84" width="21" height="3"/>
    <rect x="37.5" y="90" width="21" height="3"/>
    <!-- 颈部联珠纹 x5（Ø3，间距6） -->
    <circle cx="36" cy="42" r="1.5"/><circle cx="42" cy="42" r="1.5"/><circle cx="48" cy="42" r="1.5"/>
    <circle cx="54" cy="42" r="1.5"/><circle cx="60" cy="42" r="1.5"/>
    <!-- 交泰珠（天地之交，正轴点睛） -->
    <circle cx="48" cy="72" r="1.5"/>
    <!-- 太极鱼目 x2 -->
    <circle cx="48" cy="98.5" r="1.5"/><circle cx="48" cy="106.5" r="1.5"/>
  </g>

  <!-- 穿绳孔 Ø6（贯通孔，透出底色） -->
  <circle cx="48" cy="24" r="3" fill="#DDD2B4"/>
</svg>
