<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" viewBox="-64 -90 128 90" font-family="Noto Serif SC, SimSun, serif">
  <!-- 泰卦・玉珩式挂坠 正视图 1:1（单位 mm，y 轴向下）
       弧心 O=(0,0)，外弧 R64，弧张 120°；模数 u=1.6mm -->
  <rect x="-64" y="-90" width="128" height="90" fill="#DDD2B4"/>

  <!-- ① 墨色基板：120° 环体（r24–r64），z0–4.5 -->
  <path d="M -20.78,-12 A 24 24 0 0 1 20.78,-12 L 55.43,-32 A 64 64 0 0 0 -55.43,-32 Z" fill="#2A2419"/>

  <!-- ② 宣纸天光带：内缘留白带 r27.2–30.4，乾天在下 -->
  <path d="M -20.71,-17.64 A 27.2 27.2 0 0 1 20.71,-17.64 L 23.14,-19.71 A 30.4 30.4 0 0 0 -23.14,-19.71 Z" fill="#E9DDBC"/>

  <!-- ③ 鎏金双缘：内缘 r24–27.2，外缘 r60.8–64，通长 ±60° -->
  <path d="M -22.17,-12.8 A 25.6 25.6 0 0 1 22.17,-12.8" fill="none" stroke="#8A6A2F" stroke-width="3.2"/>
  <path d="M -54.04,-31.2 A 62.4 62.4 0 0 1 54.04,-31.2" fill="none" stroke="#8A6A2F" stroke-width="3.2"/>

  <!-- ④ 朱砂六爻：内=下=初爻，外=上=上爻；泰 111000 -->
  <!-- 下卦乾・三阳（整弧），r30.4–43.2 -->
  <path d="M -24.36,-20.75 A 32 32 0 0 1 24.36,-20.75" fill="none" stroke="#9E2B20" stroke-width="3.2"/>
  <path d="M -28.02,-23.86 A 36.8 36.8 0 0 1 28.02,-23.86" fill="none" stroke="#9E2B20" stroke-width="3.2"/>
  <path d="M -31.67,-26.97 A 41.6 41.6 0 0 1 31.67,-26.97" fill="none" stroke="#9E2B20" stroke-width="3.2"/>
  <!-- 上卦坤・三阴（两段，断缝中心角10.42°与端帽同构），r44.8–57.6 -->
  <path d="M -35.33,-30.08 A 46.4 46.4 0 0 1 -4.21,-46.21" fill="none" stroke="#9E2B20" stroke-width="3.2"/>
  <path d="M 4.21,-46.21 A 46.4 46.4 0 0 1 35.33,-30.08" fill="none" stroke="#9E2B20" stroke-width="3.2"/>
  <path d="M -38.98,-33.2 A 51.2 51.2 0 0 1 -4.65,-50.99" fill="none" stroke="#9E2B20" stroke-width="3.2"/>
  <path d="M 4.65,-50.99 A 51.2 51.2 0 0 1 38.98,-33.2" fill="none" stroke="#9E2B20" stroke-width="3.2"/>
  <path d="M -42.63,-36.31 A 56 56 0 0 1 -5.08,-55.77" fill="none" stroke="#9E2B20" stroke-width="3.2"/>
  <path d="M 5.08,-55.77 A 56 56 0 0 1 42.63,-36.31" fill="none" stroke="#9E2B20" stroke-width="3.2"/>

  <!-- ⑤ 鎏金谷纹联珠：外缘带 r57.6–60.8 之上，Ø2.0，步距6.4mm，坤地载谷 -->
  <g fill="#8A6A2F">
    <circle cx="-40.64" cy="-43.04" r="1"/><circle cx="-35.76" cy="-47.18" r="1"/>
    <circle cx="-30.46" cy="-50.76" r="1"/><circle cx="-24.81" cy="-53.75" r="1"/>
    <circle cx="-18.87" cy="-56.11" r="1"/><circle cx="-12.70" cy="-57.82" r="1"/>
    <circle cx="-6.39" cy="-58.85" r="1"/><circle cx="0" cy="-59.2" r="1"/>
    <circle cx="6.39" cy="-58.85" r="1"/><circle cx="12.70" cy="-57.82" r="1"/>
    <circle cx="18.87" cy="-56.11" r="1"/><circle cx="24.81" cy="-53.75" r="1"/>
    <circle cx="30.46" cy="-50.76" r="1"/><circle cx="35.76" cy="-47.18" r="1"/>
    <circle cx="40.64" cy="-43.04" r="1"/>
  </g>

  <!-- ⑥ 鎏金扇形端帽（满高受力件）：θ49.58°–60°，端孔 Ø3.2 -->
  <path fill-rule="evenodd" fill="#8A6A2F"
        d="M 18.27,-15.56 L 20.78,-12 L 55.43,-32 L 48.72,-41.5 Z
           M 34.35,-25.37 a 1.6 1.6 0 1 0 3.2 0 a 1.6 1.6 0 1 0 -3.2 0 Z"/>
  <path fill-rule="evenodd" fill="#8A6A2F"
        d="M -18.27,-15.56 L -20.78,-12 L -55.43,-32 L -48.72,-41.5 Z
           M -37.55,-25.37 a 1.6 1.6 0 1 0 3.2 0 a 1.6 1.6 0 1 0 -3.2 0 Z"/>

  <!-- ⑦ 鎏金顶舌（满高受力件）：宽19.2，顶圆r9.6，穿绳孔 Ø6.4 -->
  <path fill-rule="evenodd" fill="#8A6A2F"
        d="M -9.6,-60.5 L -9.6,-67.2 A 9.6 9.6 0 0 1 9.6,-67.2 L 9.6,-60.5 Z
           M -3.2,-70.4 a 3.2 3.2 0 1 0 6.4 0 a 3.2 3.2 0 1 0 -6.4 0 Z"/>

  <!-- 标注层 -->
  <g stroke="#8A6A2F" stroke-width="0.25" fill="none">
    <line x1="-55.43" y1="-32" x2="-55.43" y2="-10.2"/>
    <line x1="55.43" y1="-32" x2="55.43" y2="-10.2"/>
    <line x1="-55.43" y1="-11" x2="55.43" y2="-11"/>
    <line x1="-55.43" y1="-12" x2="-55.43" y2="-10"/>
    <line x1="55.43" y1="-12" x2="55.43" y2="-10"/>
    <line x1="-3.2" y1="-70.4" x2="-13.5" y2="-74.5"/>
    <line x1="36.8" y1="-24.2" x2="46" y2="-16.5"/>
    <line x1="56.8" y1="-32" x2="58.4" y2="-32"/><line x1="56.8" y1="-36.8" x2="58.4" y2="-36.8"/>
    <line x1="56.8" y1="-41.6" x2="58.4" y2="-41.6"/><line x1="56.8" y1="-46.4" x2="58.4" y2="-46.4"/>
    <line x1="56.8" y1="-51.2" x2="58.4" y2="-51.2"/><line x1="56.8" y1="-56" x2="58.4" y2="-56"/>
  </g>
  <g fill="#8A6A2F" font-size="2.4" text-anchor="end">
    <text x="58.8" y="-31.2">初九</text><text x="58.8" y="-36">九二</text>
    <text x="58.8" y="-40.8">九三</text><text x="58.8" y="-45.6">六四</text>
    <text x="58.8" y="-50.4">六五</text><text x="58.8" y="-55.2">上六</text>
    <text x="-15" y="-73.9">穿绳孔 Ø6.4</text>
  </g>
  <text x="47" y="-15.9" fill="#8A6A2F" font-size="2.4">端孔 Ø3.2</text>
  <text x="0" y="-84" fill="#2A2419" font-size="7" font-weight="bold" text-anchor="middle">泰 ・ 玉 珩</text>
  <text x="0" y="-79.6" fill="#8A6A2F" font-size="2.8" text-anchor="middle">乾下坤上 ・ 天地交泰 ｜ 玉珩谱系 ・ 正视图（1:1，单位 mm）</text>
  <text x="0" y="-8" fill="#8A6A2F" font-size="2.7" text-anchor="middle">弦宽 110.9 ＝ R64·√3 ｜ 弧张 120°（三分周天）｜ 总高 64.8 ｜ 厚 6.0 ＝ 基板 4.5 ＋ 浮雕 1.5</text>
  <text x="0" y="-4" fill="#8A6A2F" font-size="2.7" text-anchor="middle">模数 u＝1.6：爻厚 2u・爻距 3u・缘宽 2u・珠步 4u・绳孔 4u・端帽 5u ｜ 墨底・金框・朱爻・宣天光</text>
</svg>
