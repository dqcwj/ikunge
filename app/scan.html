<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2A2419">
<title>玄機閣 · 识物</title>
<style>
:root{--paper:#E9DDBC;--card:#F0E5C9;--ink:#2A2419;--ink-soft:#5F5541;--ink-faint:#8A7E64;
  --cinnabar:#9E2B20;--gold:#8A6A2F;--kai:"Kaiti SC","STKaiti","KaiTi",serif;--song:"Songti SC","STSong","SimSun",serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none !important}
body{font-family:var(--song);background:#171410;color:var(--card);min-height:100vh}
header{padding:14px 16px 8px;text-align:center}
h1{font-family:var(--kai);font-size:20px;letter-spacing:.35em;color:var(--card)}
.sub{font-size:12.5px;color:#b8ad93;margin-top:4px;letter-spacing:.15em}
#stage{position:relative;margin:8px auto;max-width:560px}
video{width:100%;display:block;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%}
#status{padding:10px 18px;font-size:14px;line-height:1.9;color:#b8ad93}
#status b{font-family:var(--kai);color:#e8b96a;font-weight:400}
.btn{font-family:var(--kai);font-size:17px;letter-spacing:.25em;padding:13px 30px;
  border:1px solid var(--gold);background:rgba(138,106,47,.25);color:var(--card);cursor:pointer}
.btn.primary{background:var(--cinnabar);border-color:var(--cinnabar)}
#bar{display:flex;gap:12px;justify-content:center;padding:6px 0 18px}
#tips{max-width:560px;margin:0 auto;padding:0 16px 26px}
.tip{background:rgba(240,229,201,.08);border:1px solid rgba(138,106,47,.5);
  padding:12px 14px;margin-bottom:10px;font-size:14.5px;line-height:1.8}
.tip b{font-family:var(--kai);color:#e8b96a;font-weight:400;letter-spacing:.1em}
.tip .sev{float:right;font-family:var(--kai);font-size:13px;color:#e88b7d}
#objects{max-width:560px;margin:0 auto;padding:0 16px 40px;font-size:14px;color:#b8ad93;line-height:2}
#objects b{color:var(--card);font-family:var(--kai);font-weight:400}
a.back{display:block;text-align:center;color:#8A7E64;font-size:13px;padding:0 0 24px;text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>识 物</h1>
  <p class="sub">对准家具 · 端上模型本地识别 · 定性形煞提示</p>
</header>

<div id="stage">
  <video id="cam" autoplay muted playsinline></video>
  <canvas id="boxes"></canvas>
</div>
<div id="bar">
  <button class="btn primary" id="btn-cam">开 启 相 机</button>
  <button class="btn" id="btn-record" hidden>记录所见物品</button>
  <a class="btn" href="index.html" style="text-decoration:none">返回量宅</a>
</div>
<div id="status">模型状态：<b id="model-state">加载中…</b></div>
<div id="tips" hidden></div>
<div id="objects" hidden></div>

<script src="vendor/tf.min.js"></script>
<script src="vendor/coco-ssd.min.js"></script>
<script>
"use strict";
/* COCO 类别 → 中文 + 风水相关提示 */
const MAP = {
  bed: ["床", "床已识别。请在户型页放置床位（形煞引擎按床头三区判梁压）。"],
  couch: ["沙发", "沙发已识别。梁压沙发主坐区为形煞，户型页可放置。"],
  toilet: ["马桶", "卫生间物品。若厕所在房屋正中一格即「厕占中宫」（重）。"],
  tv: ["电视", "卧室电视夜间黑屏如镜，正对床身有「镜对床」之嫌。"],
  refrigerator: ["冰箱", "厨房物品，注意灶位是否落在房屋中宫。"],
  microwave: ["微波炉", "厨房物品，注意灶位是否落在房屋中宫。"],
  oven: ["烤箱", "厨房物品，注意灶位是否落在房屋中宫。"],
  sink: ["水槽", "厨房/卫浴物品，厨厕忌压中宫。"],
  "dining table": ["餐桌", "餐桌居中为吉，靠厕则忌。"],
  chair: ["椅子", ""], clock: ["时钟", ""], "potted plant": ["绿植", "绿植可化解尖角之冲。"],
  laptop: ["笔记本", ""], book: ["书", ""], vase: ["花瓶", ""]
};
const state = { model: null, running: false, last: [], seen: new Set() };
const video = document.getElementById("cam");
const cvs = document.getElementById("boxes");
const ctx2 = cvs.getContext("2d");

document.getElementById("model-state").textContent = "正在加载本地模型…";
cocoSsd.load({ modelUrl: "vendor/model/model.json" })
  .then(m => { state.model = m; document.getElementById("model-state").textContent = "就绪（端上识别，离线可用）"; })
  .catch(() => {
    document.getElementById("model-state").innerHTML =
      "模型未就绪（vendor/model 未下载）。可在电脑上运行 <b>python vendor/get_model.py</b> 下载后刷新。当前可用下方手动勾选。";
    manualFallback();
  });

function manualFallback(){
  const tips = document.getElementById("tips");
  tips.hidden = false;
  tips.innerHTML = '<div class="tip"><b>手动识物</b>　环视房间，勾选看到的物品：</div>' +
    Object.entries(MAP).filter(([, v]) => v[1]).map(([k, v]) =>
      `<label style="display:block;padding:8px 0;font-size:15px"><input type="checkbox" data-k="${k}" style="accent-color:#9E2B20;margin-right:10px">${v[0]}</label>`).join("");
  tips.addEventListener("change", () => {
    state.seen = new Set([...tips.querySelectorAll("input:checked")].map(i => i.dataset.k));
    renderTips([...state.seen]);
  });
}

document.getElementById("btn-cam").addEventListener("click", async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    cvs.width = video.videoWidth; cvs.height = video.videoHeight;
    document.getElementById("btn-record").hidden = false;
    document.getElementById("btn-cam").textContent = "相 机 已 开";
    if (state.model) loop();
  } catch (e) { alert("相机开启失败（需 HTTPS 且授权）：" + e.message); }
});

async function loop(){
  if (!state.running && state.model && video.readyState >= 2) {
    state.running = true;
    try {
      const preds = await state.model.detect(video, 8, 0.55);
      draw(preds);
      preds.forEach(p => { if (MAP[p.class]) state.seen.add(p.class); });
      renderTips([...state.seen]);
    } catch (e) { /* 帧异常忽略 */ }
    state.running = false;
  }
  requestAnimationFrame(loop);
}

function draw(preds){
  const sx = cvs.width / (video.videoWidth || 1), sy = cvs.height / (video.videoHeight || 1);
  ctx2.clearRect(0, 0, cvs.width, cvs.height);
  ctx2.lineWidth = 3;
  ctx2.font = '22px "Kaiti SC","KaiTi",serif';
  preds.forEach(p => {
    const [x, y, w, h] = p.bbox;
    const name = MAP[p.class] ? MAP[p.class][0] : null;
    if (!name) return;
    ctx2.strokeStyle = "#E8B96A";
    ctx2.strokeRect(x * sx, y * sy, w * sx, h * sy);
    ctx2.fillStyle = "rgba(23,20,16,.75)";
    ctx2.fillRect(x * sx, y * sy - 30, name.length * 24 + 70, 32);
    ctx2.fillStyle = "#F0E5C9";
    ctx2.fillText(`${name} ${(p.score * 100) | 0}%`, x * sx + 8, y * sy - 6);
  });
  /* 定性：电视与床同框且横向上对着床 → 黑屏如镜 */
  const bed = preds.find(p => p.class === "bed"), tv = preds.find(p => p.class === "tv");
  if (bed && tv) {
    const b = bed.bbox, t = tv.bbox;
    const facing = (t[0] < b[0] ? t[0] + t[2] > b[0] - 60 : t[0] < b[0] + b[2] + 60) &&
                   !(t[1] + t[3] < b[1] || b[1] + b[3] < t[1]);
    if (facing) state.seen.add("__tv_bed__");
  }
}

function renderTips(seen){
  if (!seen.length) return;
  const tips = document.getElementById("tips");
  tips.hidden = false;
  const rows = [];
  if (seen.includes("__tv_bed__")) rows.push(["电视对床", "中", "电视黑屏如镜正对床身（夜间尤甚）", "移电视角度或加罩布"]);
  for (const k of seen) {
    if (!MAP[k] || !MAP[k][1]) continue;
    rows.push([MAP[k][0], "提示", MAP[k][1], ""]);
  }
  tips.innerHTML = rows.map(r =>
    `<div class="tip">${r[1] === "中" ? '<span class="sev">中</span>' : ""}<b>${r[0]}</b>　${r[2]}${r[3] ? "<br>建议：" + r[3] : ""}</div>`).join("");
}

document.getElementById("btn-record").addEventListener("click", () => {
  localStorage.setItem("lz_objects", JSON.stringify([...state.seen].filter(k => MAP[k]).map(k => MAP[k][0])));
  const o = document.getElementById("objects");
  o.hidden = false;
  o.innerHTML = "已记录物品：<b>" + [...state.seen].filter(k => MAP[k]).map(k => MAP[k][0]).join("、") +
    "</b>　→ 到「报告」页配合户型图使用；床位请在户型页标出以启用梁压判定。";
});
</script>
</body>
</html>
